<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نيلة — تفاصيل القطعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo-deep:#141F38;
    --indigo:#1F3060;
    --indigo-bright:#3A5698;
    --brass:#B8934F;
    --brass-light:#D8BC85;
    --bone:#EDE7D9;
    --charcoal:#1A1815;
    --sand:#DAD1BC;
    --line: rgba(237,231,217,0.16);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--charcoal);
    color:var(--bone);
    font-family:'Tajawal',sans-serif;
    font-weight:300;
  }
  h1,h2,.display{font-family:'Aref Ruqaa',serif;font-weight:700;}
  a{color:inherit;text-decoration:none;}
  .eyebrow{
    font-family:'Cairo',sans-serif;font-size:0.75rem;letter-spacing:4px;
    color:var(--brass-light);text-transform:uppercase;
  }

  nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 6vw;border-bottom:1px solid var(--line);
  }
  .logo{font-family:'Aref Ruqaa',serif;font-size:1.6rem;}
  .back-link{font-family:'Cairo';font-size:0.85rem;letter-spacing:1px;border-bottom:1px solid var(--brass-light);padding-bottom:3px;}

  .product{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:70px;
    padding:8vh 6vw 12vh;
    align-items:start;
  }
  .product-image{
    aspect-ratio:3/4;
    border-radius:2px;
  }
  .product-info h1{font-size:clamp(2.4rem,5vw,3.6rem);margin:16px 0 10px;color:var(--bone);}
  .product-info .price{
    font-family:'Cairo';font-size:1.2rem;color:var(--brass-light);margin-bottom:26px;
  }
  .product-info p.desc{
    font-size:1rem;line-height:2.1;color:var(--sand);max-width:460px;margin-bottom:32px;
  }
  .add-cta{
    display:inline-block;border:1px solid var(--brass-light);
    padding:14px 40px;font-family:'Cairo';font-size:0.85rem;letter-spacing:2px;
    transition:background .35s, color .35s;
  }
  .add-cta:hover{background:var(--brass-light);color:var(--indigo-deep);}

  .details-list{margin-top:44px;border-top:1px solid var(--line);padding-top:24px;}
  .details-list div{
    display:flex;justify-content:space-between;
    padding:12px 0;border-bottom:1px solid var(--line);
    font-size:0.9rem;color:var(--sand);
  }
  .details-list span:first-child{color:var(--brass-light);font-family:'Cairo';font-size:0.8rem;}

  @media (max-width:800px){
    .product{grid-template-columns:1fr;gap:34px;}
  }
</style>
</head>
<body>

<nav>
  <div class="logo">نيلة</div>
  <a href="neela.html" class="back-link">← العودة إلى المجموعة</a>
</nav>

<div class="product" id="productRoot">
  <!-- يُملأ عبر الجافاسكريبت أدناه -->
</div>

<script>
  // بيانات كل القطع في مكان واحد — بنفس ترتيب id المستخدم في روابط neela.html
  const products = {
    1: { name:'غمسة الفجر', category:'قفطان حريري', price:'٢٤٬٥٠٠ دج',
         swatch:'linear-gradient(135deg,#3A5698,#141F38 70%)',
         desc:'قفطان من حرير خام مغموس مرتين في أحواض النيلة الطبيعية، بلمسة تطريز نحاسي على الأكمام. قصّة فضفاضة تناسب المناسبات المسائية.' },
    2: { name:'ظل النحاس', category:'عباءة مطرزة', price:'٣١٬٠٠٠ دج',
         swatch:'linear-gradient(135deg,#B8934F,#5A4620 75%)',
         desc:'عباءة صوف وحرير بتطريز يدوي كامل بخيوط النحاس، مستوحاة من زخارف الأحواض التقليدية. بطانة قطنية ناعمة.' },
    3: { name:'رمال الظهيرة', category:'وشاح كتان', price:'٩٬٨٠٠ دج',
         swatch:'linear-gradient(160deg,#DAD1BC,#8A7C5C 80%)',
         desc:'وشاح كتان خفيف بلون الرمال، مثالي للطقس الحار. حواف مطرزة يدويًا بغرزة بسيطة تحمل توقيع المحترف.' },
    4: { name:'ليل الصحراء', category:'فستان سهرة', price:'٤٢٬٠٠٠ دج',
         swatch:'linear-gradient(150deg,#1F3060,#0C1224 80%)',
         desc:'فستان سهرة بأعمق درجات النيلة، مغموس سبع مرات ليبلغ هذا العمق. قصّة انسيابية بخط ظهر مفتوح.' },
    5: { name:'ذهب الأصيل', category:'جلابة صيفية', price:'١٨٬٥٠٠ دج',
         swatch:'linear-gradient(120deg,#D8BC85,#B8934F 70%)',
         desc:'جلابة قطنية خفيفة بلون ذهبي دافئ، مصممة للراحة اليومية دون التنازل عن الأناقة. قماش يتنفس في الأجواء الحارة.' },
    6: { name:'التقاء النيلين', category:'طقم حرير', price:'٣٦٬٢٠٠ دج',
         swatch:'linear-gradient(170deg,#3A5698,#B8934F 130%)',
         desc:'طقم من قطعتين يجمع بين درجتين من النيلة والنحاس في تدرج واحد، تصميم حصري بعدد محدود من القطع.' }
  };

  // 1. قراءة رقم المنتج من رابط الصفحة (?id=1)
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const product = products[id];

  const root = document.getElementById('productRoot');

  // 2. إذا لم يوجد المنتج (رقم خاطئ أو رابط ناقص)، نعرض رسالة بدل صفحة فارغة
  if (!product) {
    root.innerHTML = `
      <div style="grid-column:1/-1; text-align:center; padding:10vh 0;">
        <span class="eyebrow">غير موجود</span>
        <h1 style="margin-top:14px;">لم نجد هذه القطعة</h1>
        <p class="desc" style="margin:20px auto 0;">تأكدي من الرابط، أو
          <a href="neela.html" style="color:var(--brass-light); border-bottom:1px solid var(--brass-light);">عودي إلى المجموعة</a>.
        </p>
      </div>`;
  } else {
    // 3. بناء محتوى الصفحة من بيانات المنتج
    document.title = 'نيلة — ' + product.name;
    root.innerHTML = `
      <div class="product-image" style="background:${product.swatch}"></div>
      <div class="product-info">
        <span class="eyebrow">${product.category}</span>
        <h1>${product.name}</h1>
        <div class="price">${product.price}</div>
        <p class="desc">${product.desc}</p>
        <a href="#" class="add-cta">أضيفي إلى السلة</a>
        <div class="details-list">
          <div><span>القماش</span><span>حرير طبيعي مغموس بالنيلة</span></div>
          <div><span>المنشأ</span><span>محترف نيلة — الجزائر</span></div>
          <div><span>العناية</span><span>غسيل يدوي بارد فقط</span></div>
        </div>
      </div>`;
  }
</script>

</body>
</html>
